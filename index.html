<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tool Tài Xỉu - Check Cầu</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-layer"></div>
<div class="bg-grid"></div>

<!-- NÚT ZALO ADMIN -->

</a>

<div class="container">

  <div class="logo-wrap">
    <div class="logo-ring">
      <img id="logoImg" src="" alt="Logo">
    </div>
  </div>

  <h1>TOOL TÀI XỈU</h1>
  <p class="subtitle">CHECK CẦU T/X</p>

  <div class="status-badge">
    <div class="badge">ONLINE</div>
    <div class="badge gold">PRO</div>
  </div>

  <div class="steps">
    <div class="step-dot active" id="dot1">1</div>
    <div class="step-line" id="line1"></div>
    <div class="step-dot" id="dot2">2</div>
  </div>

  <div class="panel">

    <!-- BƯỚC 1: NHẬP KEY -->
    <div class="step-content active" id="step1">
      <div class="step-header">
        <span class="step-num">BƯỚC 1 / 2</span>
        <span class="step-title-text">Nhập Key Truy Cập</span>
      </div>

      <label><span class="label-icon"></span> Key của bạn</label>
      <div class="input-wrap">
        <input type="text" id="anKey" placeholder="Chu-XXXX-XXXX" autocomplete="off" spellcheck="false">
      </div>

      <!-- THÔNG TIN KEY -->
      <div class="key-info" id="keyInfo"></div>

      <button class="btn" onclick="goStep2()">TIẾP TỤC</button>
    </div>

    <!-- BƯỚC 2: NHẬP # + CHUỖI -->
    <div class="step-content" id="step2">
      <div class="step-header">
        <span class="step-num">BƯỚC 2 / 2</span>
        <span class="step-title-text">Nhập Dữ Liệu</span>
      </div>

      <div class="key-display" id="keyShow"></div>

      <label><span class="label-icon"></span> Mã #</label>
      <div class="input-wrap" style="margin-bottom:16px">
        <input type="text" id="anHash" placeholder="#000000" autocomplete="off" spellcheck="false">
      </div>

      <label><span class="label-icon"></span> Chuỗi Cầu T/X</label>
      <div class="input-wrap">
        <textarea id="anPattern" placeholder="TTTT BẺ HAY KO BẺ TXTT CẦU ĐÔI VÀ 1-1 ..." spellcheck="false"></textarea>
      </div>

      <button class="btn" onclick="analyze()">BẮT ĐẦU CHECK CẦU</button>
      <button class="btn btn-back" onclick="backStep1()">QUAY LẠI</button>
    </div>

    <!-- KẾT QUẢ -->
    <div id="anResult" class="result">
      <h3>KẾT QUẢ CHECK CẦU</h3>
      <div id="anVerdict" class="verdict"></div>
      <div id="anStats"></div>
    </div>

  </div>

  <div class="footer">POWERED BY <span>TOOL TÀI XỈU</span> • v4.0</div>
</div>

<script src="script.js"></script>
</body>
</html>
